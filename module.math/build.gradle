dependencies {
    if (System.getenv("NOT_DEV") == 'true') {
        jarJar(api("dev.anvilcraft.lib:anvillib-util-neoforge-1.21.11:latest.release"))
    } else {
        jarJar(implementation project(":anvillib-util-neoforge-1.21.11"))
    }

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

neoForge {
    // 单元测试在裸 JVM 上跑表达式树，不启动游戏，但要能拿到打了补丁的 Minecraft 类
    addModdingDependenciesTo(sourceSets.test)
}

test {
    useJUnitPlatform()
    // 想跑更多轮随机往返时可以调大，例如 -Pmath.fuzz.rounds=300000
    systemProperty 'math.fuzz.rounds', findProperty('math.fuzz.rounds') ?: '20000'
}
