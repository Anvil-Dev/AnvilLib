apply from: rootProject.file('gradle/scripts/publication-projects.gradle')

if (System.getenv('CI_BUILD') != 'false') {
    throw new GradleException('stageRelease requires CI_BUILD=false')
}

tasks.register('stageRelease', Sync) {
    group = 'publishing'
    description = 'Stage all release publications from this Minecraft checkout'
    into(layout.buildDirectory.dir('release/staging'))
    duplicatesStrategy = DuplicatesStrategy.FAIL
    anvillibPublicationProjects.each { target ->
        dependsOn("${target.path}:check", "${target.path}:publishMavenJavaPublicationToStagingRepository")
        from(target.layout.buildDirectory.dir('staging-deploy')) {
            include("dev/anvilcraft/lib/${target.name}/${rootProject.version}/**")
            exclude('**/*.asc', '**/*.asc.*')
        }
    }
}
