import java.nio.file.Files
import javax.inject.Inject
import org.gradle.process.ExecOperations

abstract class RoseauServices {
    @Inject abstract ExecOperations getExecOperations()
}

def cliVersion = '0.6.0'
configurations { roseau }
dependencies { roseau "io.github.alien-tools:roseau-cli:$cliVersion" }

// Resolving a project's own coordinates from that project can select the local component.
if (!rootProject.repositories.any { it.name == 'AnvilLibRoseauBaseline' }) {
    rootProject.repositories.maven {
        name = 'AnvilLibRoseauBaseline'
        url = 'https://server.cjsah.net:1002/maven/releases/'
        content { includeGroup 'dev.anvilcraft.lib' }
    }
}
if (!rootProject.repositories.any { it.name == 'MavenLocal' }) {
    rootProject.repositories.mavenLocal()
}

def moduleGroup = project.group.toString()
def moduleName = project.name
def currentVersion = project.version.toString()
def overrideVersion = project.findProperty('roseauBaselineVersion')
def baselineVersion = {
    if (overrideVersion) return overrideVersion
    def groupPath = moduleGroup.replace('.', '/')
    for (repoUrl in ['https://repo1.maven.org/maven2', 'https://server.cjsah.net:1002/maven/releases']) {
        try {
            def conn = new URI("$repoUrl/$groupPath/$moduleName/maven-metadata.xml").toURL().openConnection()
            conn.connectTimeout = 5000
            conn.readTimeout = 5000
            def xml = conn.inputStream.withCloseable { it.getText('UTF-8') }
            def latest = xml =~ /<latest>([^<]+)<\/latest>/
            if (latest.find()) return latest.group(1)
        } catch (IOException ignored) {
            // Try the next repository.
        }
    }
    logger.warn("Roseau: no published baseline found for $moduleName, trying $currentVersion")
    currentVersion
}

def jarTask = tasks.named('jar', Jar)
def exec = objects.newInstance(RoseauServices).execOperations
def launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(cliVersion == '0.4.0' ? 21 : 25)
}
def advisory = providers.gradleProperty('anvillibCi').isPresent()
def baselinePath = layout.buildDirectory.file('roseau-baseline/path.txt')
def baselineOwner = rootProject
// Gradle 9 requires root-owned configurations to be resolved by a root task.
def prepareBaseline = baselineOwner.tasks.register("resolveRoseauBaseline-$moduleName") {
    notCompatibleWithConfigurationCache('Resolves a detached configuration at execution time')
    doLast {
        def path = baselinePath.get().asFile
        Files.deleteIfExists(path.toPath())
        try {
            def coord = "$moduleGroup:$moduleName:${baselineVersion()}"
            def config = baselineOwner.configurations.detachedConfiguration(baselineOwner.dependencies.create(coord))
            config.transitive = false
            def baseline = config.singleFile
            path.parentFile.mkdirs()
            path.setText(baseline.absolutePath, 'UTF-8')
            logger.lifecycle("Roseau: using $coord for $moduleName")
        } catch (Exception failure) {
            if (!advisory) throw failure
            logger.warn("::warning::Roseau baseline ($moduleName): ${failure.message}")
        }
    }
}

tasks.register('roseauCheck') {
    group = 'verification'
    description = 'Detects API breaking changes against a baseline version using Roseau'
    dependsOn jarTask, prepareBaseline
    notCompatibleWithConfigurationCache('Resolves the external baseline when the comparison runs')

    doLast {
        def dir = layout.buildDirectory.dir('reports/roseau').get().asFile
        def csv = new File(dir, 'report.csv')
        def html = new File(dir, 'report.html')
        try {
            dir.mkdirs()
            Files.deleteIfExists(csv.toPath())
            Files.deleteIfExists(html.toPath())
            def path = baselinePath.get().asFile
            if (!path.isFile()) return // The advisory baseline task already reported its failure.
            def argsBase = ['--diff', '--v1', path.getText('UTF-8'),
                    '--v2', jarTask.get().archiveFile.get().asFile.absolutePath,
                    '--classpath', sourceSets.main.compileClasspath.asPath, '--fail-on-bc',
                    '--config', rootProject.file('roseau.yaml').absolutePath]
            logger.lifecycle("Roseau: checking $moduleName $currentVersion")
            // 0.4 accepts a single report per invocation. Generate both even when the API changed.
            def reports = cliVersion == '0.4.0'
                    ? [['--report', csv.absolutePath, '--format', 'CSV'], ['--report', html.absolutePath, '--format', 'HTML']]
                    : [['--report', "HTML=$html", '--report', "CSV=$csv"]]
            def statuses = reports.collect { reportArgs ->
                exec.javaexec {
                    executable = launcher.get().executablePath.asFile.absolutePath
                    classpath = configurations.roseau
                    mainClass = 'io.github.alien.roseau.cli.RoseauCLI'
                    args(argsBase + reportArgs)
                    ignoreExitValue = true
                }.exitValue
            }
            if (statuses.any { it != 0 }) throw new GradleException("Roseau exited with $statuses")
        } catch (Exception failure) {
            if (!advisory) throw failure
            logger.warn("::warning::Roseau (${project.name}): ${failure.message}")
        }
    }
}
