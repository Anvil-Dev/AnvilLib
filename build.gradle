plugins {
    alias libs.plugins.foeniculum apply false
    id 'java'
}

group = 'dev.anvilcraft.lib'
version = mod_version

if (providers.gradleProperty('anvillibRelease').isPresent()) {
    apply from: rootProject.file('gradle/scripts/release.gradle')
}

repositories {
    mavenCentral()
}

dependencies {
}

test {
    useJUnitPlatform()
}

gradle.projectsEvaluated {
    subprojects {
        apply from: rootProject.file("gradle/scripts/roseau.gradle")
    }
}
