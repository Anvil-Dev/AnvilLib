dependencies {
    implementation project(":anvillib-cube-neoforge-1.21.11")
    implementation project(":anvillib-codec-neoforge-1.21.11")
    implementation project(":anvillib-collision-neoforge-1.21.11")
    implementation project(":anvillib-config-neoforge-1.21.11")
    implementation project(":anvillib-explosion-neoforge-1.21.11")
    implementation project(":anvillib-font-neoforge-1.21.11")
    interfaceInjectionData(implementation project(":anvillib-font-neoforge-1.21.11"))
    implementation project(":anvillib-integration-neoforge-1.21.11")
    interfaceInjectionData(implementation project(":anvillib-moveable-entity-block-neoforge-1.21.11"))
    implementation project(":anvillib-multiblock-neoforge-1.21.11")
    implementation project(":anvillib-network-neoforge-1.21.11")
    interfaceInjectionData(implementation project(":anvillib-recipe-neoforge-1.21.11"))
    implementation project(":anvillib-registrum-neoforge-1.21.11")
    implementation project(":anvillib-rendering-neoforge-1.21.11")
    implementation project(":anvillib-rpc-neoforge-1.21.11")
    implementation project(":anvillib-space-select-neoforge-1.21.11")
    implementation project(":anvillib-sync-neoforge-1.21.11")
    implementation project(":anvillib-util-neoforge-1.21.11")
    implementation project(":anvillib-wheel-neoforge-1.21.11")


}

if (providers.gradleProperty('recipeTests').isPresent()) {
    neoForge.runs {
        recipeGameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'anvillib.recipeTests', 'true'
            gameDirectory = layout.buildDirectory.dir('recipe-test-run')
            programArguments.addAll '--tests', 'anvillib_test:recipe_*'
        }
    }
}

if (providers.gradleProperty('portSmoke').isPresent()) {
    neoForge.runs.client {
        systemProperty 'anvillib.portSmoke', 'true'
        gameDirectory = layout.buildDirectory.dir('port-1.21.11-smoke-run')
    }
    def result = layout.buildDirectory.file('port-1.21.11-smoke-run/port-smoke-result.txt')
    tasks.named('runClient') {
        doFirst { result.get().asFile.delete() }
        doLast {
            if (!result.get().asFile.isFile() || !result.get().asFile.text.startsWith('PASS ')) {
                throw new GradleException('Port smoke verification failed; inspect the client log and port-smoke-result.txt')
            }
        }
    }
}

if (providers.gradleProperty('configUiDemo').isPresent()) {
    neoForge.runs.client {
        gameDirectory = layout.buildDirectory.dir('config-ui-run')
    }
}

if (providers.gradleProperty('configUiTest').isPresent()) {
    neoForge.runs.client {
        systemProperty 'anvillib.configUiTest', 'true'
        gameDirectory = layout.buildDirectory.dir('config-ui-test-run')
    }
    def uiResult = layout.buildDirectory.file('config-ui-test-run/config-ui-result.txt')
    tasks.named('runClient') {
        doFirst { uiResult.get().asFile.delete() }
        doLast {
            if (!uiResult.get().asFile.isFile() || !uiResult.get().asFile.text.startsWith('PASS ')) {
                throw new GradleException('Config UI verification failed; inspect config-ui-result.txt and the client log')
            }
        }
    }
    neoForge.runs.server {
        gameDirectory = layout.buildDirectory.dir('config-server-run')
    }
    neoForge.runs {
        configGameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'anvillib.configServerTest', 'true'
            gameDirectory = layout.buildDirectory.dir('config-server-run')
            programArguments.addAll '--tests', 'anvillib_test:config_server_registration'
        }
    }
}
