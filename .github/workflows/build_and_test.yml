name: Build and Test
on:
  workflow_call:
    inputs:
      pr_build:
        required: true
        type: boolean
    secrets:
      maven_url: { required: false }
      maven_user: { required: false }
      maven_pass: { required: false }
      curseforge_token: { required: false }
      modrinth_token: { required: false }

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_BUILD: 'true'
      NOT_DEV: 'false'
      PR_BUILD: ${{ inputs.pr_build }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }

      - uses: gradle/actions/wrapper-validation@v6

      - name: Read project JDK
        id: properties
        run: sed -n '/^java_version=/p' gradle.properties >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Check Maven publication ordering
        run: python3 -B -m unittest discover -s .github/ci

      - name: Build all CI publications
        id: build
        run: |
          bash gradlew -PanvillibCi ciBuild --no-configuration-cache --max-workers=2 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
          cat build/ci/outputs >> "$GITHUB_OUTPUT"

      - name: Capture module JARs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.main_id }}-${{ steps.build.outputs.version }}
          path: build/ci/jars/*.jar
          if-no-files-found: error

      - name: Collect Roseau reports
        if: always() && inputs.pr_build
        run: |
          mkdir -p "$RUNNER_TEMP/roseau-reports"
          cp .github/modules.json "$RUNNER_TEMP/roseau-reports/modules.json"
          for dir in module.*/build/reports/roseau; do
            [[ -d "$dir" ]] || continue
            module=${dir%%/*}
            cp -R "$dir" "$RUNNER_TEMP/roseau-reports/roseau-${module#module.}"
          done

      - name: Capture Roseau reports
        if: always() && inputs.pr_build
        uses: actions/upload-artifact@v7
        with:
          name: roseau-reports
          path: ${{ runner.temp }}/roseau-reports/
          retention-days: 7

      - name: Test dedicated server startup and shutdown
        uses: Anvil-Dev/dedicated-server-launch-test@26.1-neoforge
        with:
          mods: ${{ steps.build.outputs.main_jar }}

      - name: Publish staged modules to internal Maven (main last)
        if: ${{ !inputs.pr_build }}
        env:
          MAVEN_URL: ${{ secrets.maven_url }}
          MAVEN_USERNAME: ${{ secrets.maven_user }}
          MAVEN_PASSWORD: ${{ secrets.maven_pass }}
        run: |
          if [[ -n "$MAVEN_URL" && -n "$MAVEN_USERNAME" && -n "$MAVEN_PASSWORD" ]]; then
            python3 .github/ci/publish_maven.py
          fi

      - name: Upload Beta snapshot to Modrinth and CurseForge
        if: ${{ !inputs.pr_build }}
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        continue-on-error: true
        with:
          modrinth-id: ${{ steps.build.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.modrinth_token }}
          modrinth-featured: false
          modrinth-unfeature-mode: none
          curseforge-id: ${{ steps.build.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.curseforge_token }}
          name: ${{ steps.build.outputs.main_id }} ${{ steps.build.outputs.version }}
          version: ${{ steps.build.outputs.version }}
          version-type: beta
          changelog: Update
          loaders: neoforge
          # The AnvilLib modules are already bundled in the main JAR.
          dependencies: ''
          environment: both
          game-versions: ${{ steps.build.outputs.minecraft }}
          files: |
            ${{ steps.build.outputs.main_jar }}
            ${{ steps.build.outputs.sources_jar }}
            ${{ steps.build.outputs.javadoc_jar }}
