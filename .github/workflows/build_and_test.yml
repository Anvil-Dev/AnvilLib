name: Build and Test
on:
  workflow_call:
    inputs:
      module:
        description: 'Module to build'
        required: true
        type: string
      module_id:
        description: 'Module ID to build'
        required: true
        type: string
      mod_id:
        description: 'Mod ID'
        required: true
        type: string
      ci_build:
        description: 'CI Build'
        required: true
        type: boolean
      pr_build:
        description: 'PR Build'
        required: true
        type: boolean
      gametest:
        description: 'Gametest'
        required: false
        type: boolean
        default: false
      gradle_project:
        description: 'Gradle project path or name without leading colon'
        required: false
        type: string
        default: ''
      module_dir:
        description: 'Module directory relative to repository root'
        required: false
        type: string
        default: ''
    secrets:
      maven_url:
        description: 'Maven URL'
        required: false
      maven_user:
        description: 'Maven User'
        required: false
      maven_pass:
        description: 'Maven Password'
        required: false
      curseforge_token:
        description: 'Curseforge Token'
        required: false
      modrinth_token:
        description: 'Modrinth Token'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NOT_DEV: ${{ secrets.maven_url != '' && secrets.maven_user != '' && secrets.maven_pass != '' }}
      CI_BUILD: ${{ inputs.ci_build }}
      PR_BUILD: ${{ inputs.pr_build }}
      GRADLE_PROJECT: ${{ inputs.gradle_project != '' && inputs.gradle_project || format('{0}-neoforge-26.1', inputs.module_id) }}
      MODULE_DIR: ${{ inputs.module_dir != '' && inputs.module_dir || format('module.{0}', inputs.module) }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'java_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew :${{ env.GRADLE_PROJECT }}:build

      - name: Get Version
        id: version
        shell: bash
        run: |
          ARTIFACT=$(find "$MODULE_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-shadow.jar' \
            ! -name '*-slim.jar' | head -n 1)
          FILENAME=$(basename "$ARTIFACT")
          VERSION=${FILENAME#${{ inputs.mod_id }}-neoforge-}
          VERSION=${VERSION%.jar}
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ inputs.module_id }} ${{ steps.version.outputs.version }}"
          path: ${{ steps.version.outputs.artifact }}

      - name: Publish to maven
        if: ${{ !inputs.pr_build && env.NOT_DEV == 'true' }}
        run: ./gradlew :${{ env.GRADLE_PROJECT }}:publish
        env:
          MAVEN_URL: ${{ secrets.maven_url }}
          MAVEN_USERNAME: ${{ secrets.maven_user }}
          MAVEN_PASSWORD: ${{ secrets.maven_pass }}
        continue-on-error: true

      - name: capture maven artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ inputs.module_id }}-deploy"
          path: ${{ env.MODULE_DIR }}/build/staging-deploy/

      - name: gametest
        if: ${{ inputs.ci_build && inputs.gametest }}
        uses: Anvil-Dev/dedicated-server-launch-test@26.1-neoforge
        with:
          mod: ${{ steps.version.outputs.artifact }}

      - name: Upload Release Jar
        if: ${{ !inputs.ci_build && !inputs.pr_build }}
        uses: softprops/action-gh-release@v0.1.15
        with:
          files: |
            ${{ steps.version.outputs.artifact }}

      - name: Upload MCMOD
        if: ${{ inputs.module == 'main' && !inputs.pr_build }}
        run: ./gradlew :${{ env.GRADLE_PROJECT }}:publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.curseforge_token }}
          MODRINTH_TOKEN: ${{ secrets.modrinth_token }}
