name: Publish to Maven Central
on:
  workflow_call:
    inputs:
      module:
        description: 'Module to build'
        required: true
        type: string
      module_id:
        description: 'Module ID to build'
        required: true
        type: string
      gradle_project:
        description: 'Gradle project path or name without leading colon'
        required: false
        type: string
        default: ''
      module_dir:
        description: 'Module directory relative to repository root'
        required: false
        type: string
        default: ''
    secrets:
      maven_central_username:
        description: 'Maven Central Username'
        required: true
      maven_central_password:
        description: 'Maven Central Password'
        required: true
      signing_key:
        description: 'Signing Key'
        required: true
      signing_public_key:
        description: 'Signing Public Key'
        required: true
      signing_password:
        description: 'Signing Password'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GRADLE_PROJECT: ${{ inputs.gradle_project != '' && inputs.gradle_project || format('{0}-neoforge-26.1', inputs.module_id) }}
      MODULE_DIR: ${{ inputs.module_dir != '' && inputs.module_dir || format('module.{0}', inputs.module) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'java_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Download built artifacts (fixed name)
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.module_id }}-deploy
          path: ${{ env.MODULE_DIR }}/build/staging-deploy/

      # Maven Central 的版本一经发布不可撤回，且不允许覆盖。
      # 构建号后缀（+snapshot.N / +pr.N）只用于 dev 分支的临时制品，
      # 万一本工作流被重新接入 CI 流程，这里会直接失败而不是污染正式仓库。
      - name: Verify release version
        shell: bash
        run: |
          BAD=$(find "$MODULE_DIR/build/staging-deploy" -name '*.pom' \
            | grep -E '[+](snapshot|pr)[.]' || true)
          if [ -n "$BAD" ]; then
            echo "::error::staging-deploy 中存在带构建号后缀的版本，拒绝发布到 Maven Central："
            echo "$BAD"
            exit 1
          fi

      - name: Publish to Maven Central
        run: ./gradlew :${{ env.GRADLE_PROJECT }}:jreleaserDeploy --no-configuration-cache
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.maven_central_username }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.maven_central_password }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.signing_key }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.signing_password }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.signing_public_key }}
