name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/**
      # - releases/**
    paths:
      - module.*/src/**
      - module.*/build.gradle
      - module.*/gradle.properties
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  config:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: config
      module_id: anvillib-config
      mod_id: anvillib_config
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  codec:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: codec
      module_id: anvillib-codec
      mod_id: codec
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  integration:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: integration
      module_id: anvillib-integration
      mod_id: anvillib_integration
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  moveable-entity-block:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: moveable-entity-block
      module_id: anvillib-moveable-entity-block
      mod_id: anvillib_moveable_entity_block
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  network:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: network
      module_id: anvillib-network
      mod_id: anvillib_network
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  recipe:
    needs:
      - config
      - codec
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: recipe
      module_id: anvillib-recipe
      mod_id: anvillib_recipe
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  registrum:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: registrum
      module_id: anvillib-registrum
      mod_id: anvillib_registrum
      ci_build: true
      pr_build: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  main:
    needs:
      - config
      - integration
      - moveable-entity-block
      - network
      - recipe
      - registrum
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: main
      module_id: anvillib
      mod_id: anvillib
      ci_build: true
      pr_build: true
      gametest: true
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}
