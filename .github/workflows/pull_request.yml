name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/**
      # - releases/**
    paths:
      - module.*/src/**
      - module.*/build.gradle
      - module.*/gradle.properties
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  codec:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: codec
      module_id: anvillib-codec
      mod_id: anvillib_codec
      ci_build: true
      pr_build: true
  collision:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: collision
      module_id: anvillib-collision
      mod_id: anvillib_collision
      ci_build: true
      pr_build: true
  config:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: config
      module_id: anvillib-config
      mod_id: anvillib_config
      ci_build: true
      pr_build: true
  font:
    needs:
      - rendering
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: font
      module_id: anvillib-font
      mod_id: anvillib_font
      ci_build: true
      pr_build: true
  integration:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: integration
      module_id: anvillib-integration
      mod_id: anvillib_integration
      ci_build: true
      pr_build: true
  moveable-entity-block:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: moveable-entity-block
      module_id: anvillib-moveable-entity-block
      mod_id: anvillib_moveable_entity_block
      ci_build: true
      pr_build: true
  multiblock:
    uses: ./.github/workflows/build_and_test.yml
    needs:
      - codec
      - config
      - network
      - util
    with:
      module: multiblock
      module_id: anvillib-multiblock
      mod_id: anvillib_multiblock
      ci_build: true
      pr_build: true
  network:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: network
      module_id: anvillib-network
      mod_id: anvillib_network
      ci_build: true
      pr_build: true
  recipe:
    needs:
      - codec
      - config
      - util
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: recipe
      module_id: anvillib-recipe
      mod_id: anvillib_recipe
      ci_build: true
      pr_build: true
  registrum:
    uses: ./.github/workflows/build_and_test.yml
    needs:
      - util
    with:
      module: registrum
      module_id: anvillib-registrum
      mod_id: anvillib_registrum
      ci_build: true
      pr_build: true
  rendering:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: rendering
      module_id: anvillib-rendering
      mod_id: anvillib_rendering
      ci_build: true
      pr_build: true
  space-select:
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: space-select
      module_id: anvillib-space-select
      mod_id: anvillib_space_select
      ci_build: true
      pr_build: true
  sync:
    uses: ./.github/workflows/build_and_test.yml
    needs:
      - codec
      - network
      - util
    with:
      module: sync
      module_id: anvillib-sync
      mod_id: anvillib_sync
      ci_build: true
      pr_build: true
  util:
    uses: ./.github/workflows/build_and_test.yml
    needs:
      - codec
    with:
      module: util
      module_id: anvillib-util
      mod_id: anvillib_util
      ci_build: true
      pr_build: true
  wheel:
    uses: ./.github/workflows/build_and_test.yml
    needs:
      - rendering
      - util
    with:
      module: wheel
      module_id: anvillib-wheel
      mod_id: anvillib_wheel
      ci_build: true
      pr_build: true
  main:
    needs:
      - codec
      - collision
      - config
      - font
      - integration
      - moveable-entity-block
      - multiblock
      - network
      - recipe
      - registrum
      - rendering
      - space-select
      - sync
      - util
      - wheel
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: main
      module_id: anvillib
      mod_id: anvillib
      ci_build: true
      pr_build: true
      gametest: true
