name: Release for Mod
on:
  release:
    types:
      - published
    branches:
      - dev/**

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      level_0: ${{ steps.matrix.outputs.level_0 }}
      level_1: ${{ steps.matrix.outputs.level_1 }}
      level_2: ${{ steps.matrix.outputs.level_2 }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: node .github/workflows/generate-matrix.js

  # ── Build (topological levels) ──────────────────────────────────

  build-l0:
    needs: [prepare]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_0) }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
      mod_id: ${{ matrix.mod_id }}
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  build-l1:
    needs: [prepare, build-l0]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_1) }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
      mod_id: ${{ matrix.mod_id }}
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  build-l2:
    needs: [prepare, build-l1]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_2) }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
      mod_id: ${{ matrix.mod_id }}
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  # ── Maven Central deploy ────────────────────────────────────────

  deploy-l0:
    needs: [prepare, build-l0]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_0) }}
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  deploy-l1:
    needs: [prepare, build-l1]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_1) }}
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  deploy-l2:
    needs: [prepare, build-l2]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_2) }}
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  # ── Main (aggregator) ───────────────────────────────────────────

  main:
    needs: [build-l2]
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: main
      module_id: anvillib
      mod_id: anvillib
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  main-maven-central-deploy:
    needs: [main]
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: main
      module_id: anvillib
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}
