name: Release AnvilLib
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify all seven releases without publishing
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: anvillib-coordinated-release
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_BUILD: 'false'
  PR_BUILD: 'false'
  NOT_DEV: 'false'
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/dev/26.1'
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Check release recovery and publication gates
        run: python3 -m unittest discover -s .github/release
      - id: plan
        run: python3 .github/release/release.py prepare
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.new == 'true'
        with:
          name: source-plan
          path: release-plan.json
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      LINE: ${{ matrix.line }}
      SOURCE_SHA: ${{ matrix.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with: { path: control, persist-credentials: false }
      - id: cache
        working-directory: control/.github/release
        run: python3 -c 'import os; from common import artifact, output; output("built", bool(artifact("build-" + os.environ["LINE"])))'
      - uses: actions/checkout@v6
        if: steps.cache.outputs.built != 'True'
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.built != 'True'
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        if: steps.cache.outputs.built != 'True'
      - name: Stage and verify local publications
        if: steps.cache.outputs.built != 'True'
        run: |
          (cd source && bash gradlew -PanvillibRelease stageRelease --no-configuration-cache)
          python3 control/.github/release/artifacts.py source "$LINE" "$SOURCE_SHA" "$RELEASE_VERSION" source/build/release/dist
      - uses: actions/upload-artifact@v7
        if: steps.cache.outputs.built != 'True'
        with:
          name: build-${{ matrix.line }}
          path: source/build/release/
          if-no-files-found: error

  seal:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: source-plan }
      - uses: actions/download-artifact@v8
        with: { pattern: 'build-*', path: bundles }
      - run: python3 .github/release/release.py seal

  central:
    needs: [prepare, seal]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions: { actions: read, contents: read, statuses: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      LINE: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v6
        with: { path: control, persist-credentials: false }
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.line }}
          path: built
      - name: Deploy and wait for PUBLISHED
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGNING_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.SIGNING_PUBLIC_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        run: python3 control/.github/release/central.py "$TAG" "$LINE" source built/staging

  mod-sites:
    needs: [prepare, seal]
    if: ${{ !inputs.dry_run }}
    permissions: { actions: read, contents: read, statuses: write }
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.matrix) }}
        platform: [modrinth, curseforge]
    uses: ./.github/workflows/mod_site.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      line: ${{ matrix.target.line }}
      platform: ${{ matrix.platform }}
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  publish:
    needs: [prepare, seal, central]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: python3 .github/release/release.py publish "$TAG"

  bump:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      LINE: ${{ matrix.line }}
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: python3 .github/release/release.py bump "$TAG" "$LINE"
