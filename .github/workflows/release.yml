name: Release for Mod
# 发布到 Maven Central 的唯一入口：发布 Release 事件。
# 推送 dev/** 分支由 ci.yml 负责构建与测试，不做任何 Maven Central 发布。
# 制品版本取自 gradle.properties 的 mod_version，发布前必须确认已推进该版本号：
# Maven Central 的版本一经发布不可撤回，重复使用同一版本号会导致部署失败。
on:
  release:
    types:
      - published

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      level_0: ${{ steps.matrix.outputs.level_0 }}
      level_1: ${{ steps.matrix.outputs.level_1 }}
      level_2: ${{ steps.matrix.outputs.level_2 }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        run: node .github/workflows/generate-matrix.js

  # ── Build (topological levels) ──────────────────────────────────

  processor-build:
    needs: [prepare]
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: sync
      module_id: anvillib-sync-processor
      mod_id: anvillib_sync_processor
      ci_build: false
      pr_build: false
      gradle_project: anvillib-sync-neoforge-1.21.11:anvillib-sync-processor-neoforge-1.21.11
      module_dir: module.sync/processor
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  build-l0:
    needs: [prepare]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_0) }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
      mod_id: ${{ matrix.mod_id }}
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  build-l1:
    needs: [prepare, build-l0]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_1) }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
      mod_id: ${{ matrix.mod_id }}
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  build-l2:
    needs: [prepare, build-l1, processor-build]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_2) }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
      mod_id: ${{ matrix.mod_id }}
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  # ── Maven Central deploy ────────────────────────────────────────

  processor-deploy:
    needs: [processor-build]
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: sync
      module_id: anvillib-sync-processor
      gradle_project: anvillib-sync-neoforge-1.21.11:anvillib-sync-processor-neoforge-1.21.11
      module_dir: module.sync/processor
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  deploy-l0:
    needs: [prepare, build-l0]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_0) }}
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  deploy-l1:
    needs: [prepare, build-l1]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_1) }}
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  deploy-l2:
    needs: [prepare, build-l2]
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.level_2) }}
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: ${{ matrix.module }}
      module_id: ${{ matrix.module_id }}
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}

  # ── Main (aggregator) ───────────────────────────────────────────

  main:
    needs: [build-l2]
    uses: ./.github/workflows/build_and_test.yml
    with:
      module: main
      module_id: anvillib
      mod_id: anvillib
      ci_build: false
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}

  main-maven-central-deploy:
    # 汇总模块的 pom 依赖各子模块，必须等子模块全部落到 Maven Central 之后再发布，
    # 否则消费者在这段窗口里会解析到依赖尚未就绪的 pom。
    needs: [main, processor-deploy, deploy-l0, deploy-l1, deploy-l2]
    uses: ./.github/workflows/publish_maven_central.yml
    with:
      module: main
      module_id: anvillib
    secrets:
      maven_central_username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven_central_password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      signing_key: ${{ secrets.SIGNING_KEY }}
      signing_public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
      signing_password: ${{ secrets.SIGNING_PASSWORD }}
