name: CI for Mod
on:
  workflow_dispatch:
  push:
    branches: ['dev/**']
    paths:
      - .github/modules.json
      - .github/ci/**
      - .github/workflows/build_and_test.yml
      - .github/workflows/ci.yml
      - gradle/**
      - gradlew
      - gradlew.bat
      - module.*/src/**
      - module.sync/processor/src/**
      - module.*/build.gradle
      - module.sync/processor/build.gradle
      - module.*/gradle.properties
      - module.sync/processor/gradle.properties
      - build.gradle
      - module.gradle
      - gradle.properties
      - settings.gradle

permissions:
  contents: read

# Each development line owns its Maven coordinates and their version indexes.
concurrency:
  group: anvillib-snapshots-26.2
  queue: max

jobs:
  build:
    uses: ./.github/workflows/build_and_test.yml
    with:
      pr_build: false
    secrets:
      maven_url: ${{ secrets.MAVEN_URL }}
      maven_user: ${{ secrets.MAVEN_USER }}
      maven_pass: ${{ secrets.MAVEN_PASS }}
      curseforge_token: ${{ secrets.CURSEFORGE_TOKEN }}
      modrinth_token: ${{ secrets.MODRINTH_TOKEN }}
