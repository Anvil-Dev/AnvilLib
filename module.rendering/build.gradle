tasks.register('runStd140LayoutRulesTest', JavaExec) {
    group = 'verification'
    description = 'Runs lightweight std140 layout rule checks.'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'dev.anvilcraft.lib.v2.rendering.foundation.buffers.layout.Std140LayoutRulesTest'
}


tasks.named('check') {
    dependsOn tasks.named('runStd140LayoutRulesTest')
}

sourceSets {
    previewTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('previewTest', JavaExec) {
    group = 'verification'
    description = '验证共享结构预览的注册与只读绘制状态'
    dependsOn tasks.named('previewTestClasses')
    classpath = sourceSets.previewTest.runtimeClasspath
    mainClass = 'dev.anvilcraft.lib.v2.rendering.preview.gui.PreviewRegressionTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = java.toolchain.languageVersion }
}

tasks.named('check') { dependsOn tasks.named('previewTest') }
