pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include 'module.config'
include 'module.codec'
include 'module.integration'
include 'module.moveable-entity-block'
include 'module.network'
include 'module.recipe'
include 'module.registrum'
include 'module.wheel'
include 'module.main'
include 'module.test'

project(':module.config').name = 'anvillib-config-neoforge-1.21.1'
project(':module.codec').name = 'anvillib-codec-neoforge-1.21.1'
project(':module.integration').name = 'anvillib-integration-neoforge-1.21.1'
project(':module.moveable-entity-block').name = 'anvillib-moveable-entity-block-neoforge-1.21.1'
project(':module.network').name = 'anvillib-network-neoforge-1.21.1'
project(':module.recipe').name = 'anvillib-recipe-neoforge-1.21.1'
project(':module.registrum').name = 'anvillib-registrum-neoforge-1.21.1'
project(':module.wheel').name = 'anvillib-wheel-neoforge-1.21.1'
project(':module.main').name = 'anvillib-neoforge-1.21.1'
project(':module.test').name = 'anvillib-test-neoforge-1.21.1'
