pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include 'module.config'
include 'module.codec'
include 'module.integration'
include 'module.moveable-entity-block'
include 'module.multiblock'
include 'module.network'
include 'module.recipe'
include 'module.registrum'
include 'module.util'
include 'module.wheel'
include 'module.yukkuri'
include 'module.main'
include 'module.rpc'
include 'module.rendering'
include 'module.font'
include 'module.space-select'
include 'module.explosion'
include 'module.collision'
include 'renderdoc-loader'
include 'module.sync'
include 'module.sync:processor'
include 'module.test'

project(':module.config').name = 'anvillib-config-neoforge-1.21.1'
project(':module.codec').name = 'anvillib-codec-neoforge-1.21.1'
project(':module.integration').name = 'anvillib-integration-neoforge-1.21.1'
